name: Build XCFramework

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9:00 UTC (18:00 KST)
  workflow_dispatch:
    inputs:
      version:
        description: 'LookinServer version (e.g., 1.2.8)'
        required: false
        type: string

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new version
        id: check
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(curl -s https://api.github.com/repos/QMUI/LookinServer/tags | jq -r '.[0].name')
          fi

          echo "Upstream version: $VERSION"

          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version $VERSION detected, will build"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Clone LookinServer
        run: |
          git clone --depth 1 --branch ${{ needs.check-version.outputs.version }} \
            https://github.com/QMUI/LookinServer.git
          echo "Cloned LookinServer ${{ needs.check-version.outputs.version }}"

      - name: Build iOS Device
        run: |
          cd LookinServer
          xcodebuild build \
            -scheme LookinServer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "../build/ios-device" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO

      - name: Build iOS Simulator
        run: |
          cd LookinServer
          xcodebuild build \
            -scheme LookinServer \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "../build/ios-simulator" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO

      - name: Create XCFramework
        run: |
          # Find the built products
          DEVICE_LIB=$(find build/ios-device -name "libLookinServer.a" | head -1)
          SIM_LIB=$(find build/ios-simulator -name "libLookinServer.a" | head -1)

          echo "Device lib: $DEVICE_LIB"
          echo "Simulator lib: $SIM_LIB"

          # If static libraries found, we need headers too
          if [ -n "$DEVICE_LIB" ]; then
            echo "Found static libraries, creating XCFramework from .a files"

            # Find headers
            DEVICE_HEADERS=$(dirname "$DEVICE_LIB")

            # Find all related static libraries
            DEVICE_DIR=$(dirname "$DEVICE_LIB")
            SIM_DIR=$(dirname "$SIM_LIB")

            echo "Device dir: $DEVICE_DIR"
            echo "Sim dir: $SIM_DIR"
            ls -la "$DEVICE_DIR/" || true

            # Try to find swiftmodule
            find build -name "*.swiftmodule" -type d 2>/dev/null || true
            find build -name "LookinServer*" 2>/dev/null | head -20

            # For static library, we need to create framework structure manually
            # or use the framework if SPM created one
            DEVICE_FW=$(find build/ios-device -name "LookinServer.framework" -type d | head -1)
            SIM_FW=$(find build/ios-simulator -name "LookinServer.framework" -type d | head -1)

            if [ -n "$DEVICE_FW" ] && [ -n "$SIM_FW" ]; then
              echo "Found frameworks"
              xcodebuild -create-xcframework \
                -framework "$DEVICE_FW" \
                -framework "$SIM_FW" \
                -output "LookinServer.xcframework"
            else
              echo "No frameworks found, creating from static libraries"

              # Create framework structure manually
              mkdir -p frameworks/ios-device/LookinServer.framework
              mkdir -p frameworks/ios-simulator/LookinServer.framework

              cp "$DEVICE_LIB" frameworks/ios-device/LookinServer.framework/LookinServer
              cp "$SIM_LIB" frameworks/ios-simulator/LookinServer.framework/LookinServer

              # Find and copy headers
              HEADER_DIR=$(find build/ios-device -path "*/LookinServer.build/DerivedSources" -o -path "*/include/LookinServer" | head -1)
              if [ -z "$HEADER_DIR" ]; then
                HEADER_DIR=$(find LookinServer/Src -name "*.h" -exec dirname {} \; | sort -u | head -1)
              fi

              # Copy public headers from source
              mkdir -p frameworks/ios-device/LookinServer.framework/Headers
              mkdir -p frameworks/ios-simulator/LookinServer.framework/Headers
              find LookinServer/Src -name "*.h" -exec cp {} frameworks/ios-device/LookinServer.framework/Headers/ \;
              find LookinServer/Src -name "*.h" -exec cp {} frameworks/ios-simulator/LookinServer.framework/Headers/ \;

              # Copy Swift modules if they exist
              DEVICE_SWIFTMODULE=$(find build/ios-device -name "LookinServer.swiftmodule" -type d | head -1)
              SIM_SWIFTMODULE=$(find build/ios-simulator -name "LookinServer.swiftmodule" -type d | head -1)

              if [ -n "$DEVICE_SWIFTMODULE" ]; then
                mkdir -p frameworks/ios-device/LookinServer.framework/Modules
                cp -R "$DEVICE_SWIFTMODULE" frameworks/ios-device/LookinServer.framework/Modules/
              fi
              if [ -n "$SIM_SWIFTMODULE" ]; then
                mkdir -p frameworks/ios-simulator/LookinServer.framework/Modules
                cp -R "$SIM_SWIFTMODULE" frameworks/ios-simulator/LookinServer.framework/Modules/
              fi

              # Create Info.plist
              for arch in ios-device ios-simulator; do
                cat > frameworks/$arch/LookinServer.framework/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>LookinServer</string>
            <key>CFBundleIdentifier</key>
            <string>com.lookin.LookinServer</string>
            <key>CFBundleName</key>
            <string>LookinServer</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          PLIST
              done

              xcodebuild -create-xcframework \
                -framework "frameworks/ios-device/LookinServer.framework" \
                -framework "frameworks/ios-simulator/LookinServer.framework" \
                -output "LookinServer.xcframework"
            fi
          else
            echo "ERROR: Could not find any build products"
            find build -type f \( -name "*.a" -o -name "*.framework" \) 2>/dev/null
            exit 1
          fi

      - name: Verify XCFramework
        run: |
          echo "=== XCFramework Contents ==="
          ls -la LookinServer.xcframework/

          # Verify slices exist
          if [ ! -d "LookinServer.xcframework/ios-arm64" ]; then
            echo "ERROR: Missing ios-arm64 slice"
            exit 1
          fi

          SIMULATOR_SLICE=$(ls -d LookinServer.xcframework/ios-*-simulator 2>/dev/null | head -1)
          if [ -z "$SIMULATOR_SLICE" ]; then
            echo "ERROR: Missing simulator slice"
            exit 1
          fi

          echo "XCFramework verification passed"

      - name: Create ZIP
        run: |
          zip -r -X LookinServer.xcframework.zip LookinServer.xcframework
          ls -lh LookinServer.xcframework.zip

      - name: Calculate Checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum LookinServer.xcframework.zip)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Checksum: $CHECKSUM"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LookinServer-${{ needs.check-version.outputs.version }}
          path: LookinServer.xcframework.zip
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: LookinServer ${{ needs.check-version.outputs.version }}
          files: LookinServer.xcframework.zip
          body: |
            ## LookinServer XCFramework ${{ needs.check-version.outputs.version }}

            ### Swift Package Manager

            Add this package to your project:
            ```
            https://github.com/${{ github.repository }}
            ```

            Or use as a binary target:
            ```swift
            .binaryTarget(
                name: "LookinServer",
                url: "https://github.com/${{ github.repository }}/releases/download/${{ needs.check-version.outputs.version }}/LookinServer.xcframework.zip",
                checksum: "${{ steps.checksum.outputs.checksum }}"
            )
            ```

            ### Checksum
            ```
            ${{ steps.checksum.outputs.checksum }}
            ```

            ### Source
            Built from [QMUI/LookinServer@${{ needs.check-version.outputs.version }}](https://github.com/QMUI/LookinServer/releases/tag/${{ needs.check-version.outputs.version }})

      - name: Update Package.swift
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          CHECKSUM="${{ steps.checksum.outputs.checksum }}"
          REPO="${{ github.repository }}"

          cat > Package.swift << EOF
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "LookinServer",
              platforms: [.iOS(.v12)],
              products: [
                  .library(name: "LookinServer", targets: ["LookinServer"])
              ],
              targets: [
                  .binaryTarget(
                      name: "LookinServer",
                      url: "https://github.com/${REPO}/releases/download/${VERSION}/LookinServer.xcframework.zip",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git diff --cached --quiet || git commit -m "Release ${VERSION}"
          git push
